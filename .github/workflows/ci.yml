name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci --ignore-scripts

      - name: Build package
        working-directory: packages/cli
        run: npm run build

      - name: Run package tests
        working-directory: packages/cli
        run: npm test

      - name: Verify package tarball
        working-directory: packages/cli
        run: npm pack --dry-run

  proxy-install:
    name: Proxy install tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '20'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci --ignore-scripts

      - name: Build package
        working-directory: packages/cli
        run: npm run build

      - name: Run proxy install tests
        working-directory: packages/cli
        run: npm run test:proxy

      - name: Verify package tarball
        working-directory: packages/cli
        run: npm pack --dry-run
