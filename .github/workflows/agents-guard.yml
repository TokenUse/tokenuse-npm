name: AGENTS Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify AGENTS coverage
        run: bash devops/agents/verify-agents.sh
