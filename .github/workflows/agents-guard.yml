name: AGENTS Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify AGENTS coverage
        run: bash devops/agents/verify-agents.sh
