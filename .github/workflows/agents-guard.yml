name: AGENTS Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Verify AGENTS coverage
        run: bash devops/agents/verify-agents.sh
