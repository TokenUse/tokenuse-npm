name: AGENTS Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify AGENTS coverage
        run: bash devops/agents/verify-agents.sh
